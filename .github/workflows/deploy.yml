name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /salvatorelaspata.net
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      # Monorepo (npm workspaces): withastro/action cerca il lockfile nella cartella
      # dell'app, quindi installazione e build sono esplicite.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build salvatorelaspata.net
        run: npm run build:net
      - name: Upload site output
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/net/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
